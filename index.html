<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="#inicio">Inicio</a>
        <a href="#galeria">Galería</a>
        <a href="#contacto">Contacto</a>
        <a href="#alojamiento">Alojamiento</a>
        <a href="#ubicacion">Ubicacion</a>
        <a href="#preguntas-frecuentes">Preguntas Frecuentes</a>
    </nav>
    <section id="Inicio">
        <h1>Bienvenidos</h1>
    </section>
    <section id="Galeria">
        <h2>Galeria</h2>
    </section>
    <section id="Contacto">
        <h2>Contacto</h2>
         <form>
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" autocomplete="additional-name" required>
        <label for="correo">Correo</label>
        <input type="email" id="correo" name="email" autocomplete="email" required>
        <label for="telefono">Telefono</label>
        <input type="tel" id="telefono" name="tel" autocomplete="tel">
        <label for="mensaje">Mensaje</label>
        <textarea id="mensaje" name="mensaje" required></textarea>
        <button type="submit"></button>
    </form>
    </section>
    <section id="Alojamiento">
        <h2>Alojamiento</h2>
    </section>
    <section id="Ubicacion"><H2>Ubicacion</H2>
    </section>
    <section id="preguntas-frecuentes">
    <H2>Preguntas Frecuentes</H2>
    </section>
   
</body>
</html>
